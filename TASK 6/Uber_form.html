<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride Request</title>
    <style>
        /* CONTAINER */
        .container {
            display: block;
            box-sizing: border-box;
            width: 350px;
            padding: 25px;
            margin: 50px auto;
            background-color: #ffffff;
            border: 2px solid #7e7d7d;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* HEADING */
        h1 {
            display: block;
            margin: 0 0 20px 0;
            font-size: 28px;
            font-weight: normal;
            color: #000000;
        }

        /* INPUT */
        input[type="text"] {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 12px 15px;
            margin-bottom: 10px;
            border: none;
            border-radius: 3px;
            background-color: #f0f0f0;
            font-size: 14px;
            color: #666666;
        }

        /* BUTTONS */
        .btn {
            display: inline-block;
            padding: 12px 20px;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-primary {
            float: left;
            background-color: #000000;
            color: #ffffff;
        }

        .btn-secondary {
            float: right;
            background-color: #f0f0f0;
            color: #000000;
        }

        /* HOVER */
        .btn-primary:hover {
            background-color: #333333;
        }

        .btn-secondary:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Request a ride now</h1>
        <input type="text" placeholder="Enter pickup location">
        <input type="text" placeholder="Enter destination">
        <button class="btn btn-primary">Request now</button>
        <button class="btn btn-secondary">Schedule for later</button>
    </div>
</body>
</html>
