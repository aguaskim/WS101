<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beginner CSS Layout Practice</title>
    <style>
        /*Two text boxes on separate lines; Using display: block */
        .textboxes input {
            display: block;      
            margin-bottom: 10px;   
            padding: 8px;
            width: 250px;
            border: 1px solid #ccc;
            
            /*rounded corners*/
            border-radius: 6px;         
            font-size: 14px;
        }

        /* Paragraph and 2 buttons on the same line; Using width, display: inline-block, and vertical-align: middle */
        .inline-section {
            margin-top: 30px;
            background-color: #f5f5f5;
            padding: 15px;
        }

        /* The survey text box */
        .survey-text {
            display: inline-block;  
            width: 400px;               
            vertical-align: middle;     
            margin: 0;
            background-color: white;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .inline-section button {
            display: inline-block;    
            width: 60px;            
            vertical-align: middle;     
            padding: 6px 12px;       
            margin-left: 5px;           
            
            /*rounded buttons*/
            background-color: #ffffff;
            border: 1px solid #969292;     
            border-radius: 6px;         
            font-size: 14px;
            cursor: pointer;
        }

        .inline-section button:hover {
            background-color: #b7b3b3;  
        }

        /*Google Search Form; Logo positioned with margin*/
        .google-section {
            margin-top: 40px;
            text-align: center;         
        }

         /* Position with margin*/
        .google-logo {
            margin-top: 20px;          
            margin-bottom: 20px;        
            margin-left: auto;          
            margin-right: auto;
            display: block;           
            width: 272px;               
        }

        .search-input {
            width: 400px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 20px;
        }

        .search-buttons {
            margin-top: 15px;
        }

        .search-buttons button {
            padding: 8px 16px;
            margin: 0 5px;
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            cursor: pointer;
        }

        .search-buttons button:hover {
            border: 1px solid #dadce0;
        }
    </style>
</head>
<body>

    <!-- Two text boxes on separate lines -->
    <div class="textboxes">
        <input type="text" placeholder="Name">
        <input type="text" placeholder="Email">
    </div>

    <!-- Survey text and 2 buttons on the same line -->
    <div class="inline-section">
        <div class="survey-text">Thanks for chatting with our customer support. Would you like to take our quick survey?</div>
        <button>Yes</button>
        <button>No</button>
    </div>

    <!-- Google Search Form -->
    <div class="google-section">
        <img src="https://static.vecteezy.com/system/resources/previews/029/284/974/non_2x/google-logo-on-transparent-background-popular-search-engine-google-logotype-symbol-icon-google-sign-stock-free-vector.jpg" 
             alt="Google" 
             class="google-logo">
        
        <form action="https://www.google.com/search" method="GET">
            <input type="text" name="q" class="search-input" placeholder="Search Google or type a URL...">
        </form>
    </div>

</body>
</html>
