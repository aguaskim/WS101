<!DOCTYPE html>
<html>
<head>
    <style>
        /* Container  */
        .box {
            width: 300px;
            padding: 15px;
            border: 2px solid rgb(208, 202, 202);
            margin: 20px auto;
        }

        /* Inline-Block*/
        .half {
            display: inline-block;
            width: 48%;
        }

        /* Block Level */
        input {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* Button */
        button {
            display: block;
            width: 100%;
            padding: 12px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        button:hover {
            background: #3367d6;
        }
    </style>
</head>
<body>

    <div class="box">
        <!-- Inline-Block: two inputs, side by side -->
        <div class="half"><input placeholder="First name"></div>
        <div class="half" style="float:right;"><input placeholder="First name"></div>
        
        <!-- Block: input -->
        <input placeholder="Email">
        
        <!-- Block: button -->
        <button>Sign Up</button>
    </div>

</body>
</html>
